<div class="p-6 border-b border-white/5 flex justify-between items-center">
  <h3
    class="text-sm font-bold uppercase tracking-widest opacity-60 flex items-center gap-2"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="currentColor"
      viewBox="0 0 20 20"
      class="h-4 w-4 text-amber-400"
    >
      <path
        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
      ></path>
    </svg>

    {{ type() === 'product' ? 'Opiniones del Producto' : 'Opiniones del
    Distribuidor' }}
  </h3>
</div>

<div class="p-6">
  <!-- Banner del Promedio General -->
  <div
    class="border p-6 rounded-2xl flex flex-col sm:flex-row items-center gap-6 justify-between transition-all duration-300"
    [style.background-color]="styles().card_bg || null"
    [class.border-neutral-800/80]="themeStore.theme() === 'chadmax'"
    [class.shadow-md]="themeStore.theme() === 'chadmax'"
    [class.border-slate-200]="themeStore.theme() !== 'chadmax'"
    [class.bg-slate-100]="themeStore.theme() !== 'chadmax'"
  >
    <div
      class="flex items-center gap-5 w-full sm:w-auto justify-center sm:justify-start"
    >
      <span
        class="text-5xl font-black italic tracking-tighter"
        [class.text-white]="themeStore.theme() === 'chadmax'"
        [class.text-slate-900]="themeStore.theme() !== 'chadmax'"
      >
        {{ averageRating() }}
      </span>
      <div class="flex flex-col">
        <div class="rating rating-sm pointer-events-none">
          @for (star of [1, 2, 3, 4, 5]; track star) {
          <input
            type="radio"
            disabled
            [checked]="averageRatingRounded() === star"
            class="mask mask-star-2 bg-amber-400 opacity-20"
            [class.opacity-100]="star <= averageRatingRounded()"
          />
          }
        </div>
        <span
          class="text-[10px] opacity-40 uppercase font-bold tracking-widest mt-1"
        >
          Promedio General ({{ reviews().length }} {{ reviews().length === 1 ?
          "opinión" : "opiniones" }})
        </span>
      </div>
    </div>

    <div
      class="text-xs opacity-30 italic text-center sm:text-right hidden sm:block"
    >
      Basado en calificaciones <br />
      de compradores reales
    </div>
  </div>
</div>
